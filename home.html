 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
     <!-- Daisy ui   -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- Google font   -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"> 
     <!-- Font Awasome cdn  -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>
    <header>
        <div class="navbar bg-base-100 shadow-sm">
          <div class="w-10 px-2">

              <img src="./assets/github-logo.png" alt="">
          </div>
            <div class="flex-1 ">
                <a class="btn btn-ghost text-xl">GitHub Issues Tracker</a>
            </div>
            <div class="flex gap-2">
                <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
               
            </div>
              <div>
                <p class="bg-primary text-white p-1.5 px-2 ms-2">+ new Issue</p>
              </div>
        </div>
     </header> 

    

    <nav  class="w-10/12 mx-auto mt-10 bg-base-100 shadow p-4 rounded-lg ">
    <div id="load-button" class="flex gap-2 ">
        <button id="all-btn" class=" btn  btn-primary">All</button>
        <button id="open-btn" class="btn  btn btn-outline btn-primary">Open</button>
        <button id="close-btn" class=" btn btn-outline btn-primary">Closed</button>
    </div>
</nav>
   <!-- countable -- part  -->
 <section class=" flex justify-between items-center w-10/12 mx-auto mt-8 p-6 border border-gray-100 shadow-md mb-5 flex-wrap" id="issue-counter">
     <div class="flex items-center gap-2">
        <div class="w-[50px] h-[50px] rounded-full bg-gray-300 relative ">
        <div class="w-[27px] h-[27px]  text-blue-700 absolute top-3 left-3.5"><i class="fa-solid fa-basketball"></i></div>
     </div>
     <div>
         <h1 class="font-bold text-[30px]" id="issue-count">0 Issues</h1>
      <p class="text-gray-400">Track and manage your project issues</p>

     </div>
     </div>
     <div class="flex gap-3">
        <p class=""><span class="text-green-500"><i class="fa-solid fa-circle-dot"></i></span> Open</p>
        <p class=""><span class="text-violet-500"><i class="fa-solid fa-circle-dot"></i></span> Closed</p>
       
        
     </div>
        
</section> 
<section></section>

<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 w-10/12 mx-auto" id="container">
   
</section>
    <script src="./home.js"></script>
</body>

</html>
